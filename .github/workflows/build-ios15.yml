name: Build Flare iOS 15 IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ ios15-build ]

jobs:
  build:
    # GitHub 官方 macOS 26 运行器，预装 Xcode 26.6（Swift 6.2）。
    # 上游用 xcode-27 标签（自托管/付费），免费账号用 macos-26 即可。
    runs-on: macos-26
    # 全量编译（Kotlin/Native + 整个 Swift 模块）约 65-70 分钟，
    # 给到 150 分钟留足余量；真卡死了也别烧满默认的 6 小时。
    timeout-minutes: 150

    env:
      GRADLE_JVM_ARGS: "-Xmx12G -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Kotlin Multiplatform 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Xcode version (调试用)
        run: xcodebuild -version

      # 多轮迭代靠这两个缓存把耗时压下来：Gradle/Kotlin 依赖与 Xcode 增量编译产物。
      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('appleApp/**/*.swift', 'appleApp/project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (appleApp)
        run: |
          cd appleApp
          xcodegen generate

      - name: Build unsigned IPA (iOS 15, device)
        run: |
          chmod +x gradlew
          cd appleApp
          xcodebuild \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            -archivePath /tmp/Flare.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r /tmp/Flare.xcarchive/Products/Applications/Flare.app Payload/
          zip -r Flare-iOS15.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-ipa
          path: Flare-iOS15.ipa
