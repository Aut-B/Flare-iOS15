name: Build Flare iOS 15 IPA (TrollStore)

# 触发：push 到 ios15-build，或手动 Run workflow
on:
  workflow_dispatch:
  push:
    branches: [ ios15-build ]

# 同一分支只保留最新一次，旧的自动取消，不排队烧时间
concurrency:
  group: ios15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  GRADLE_JVM_ARGS: "-Xmx12G -Dfile.encoding=UTF-8"

jobs:
  # 1) 冒烟：在模拟器里真的装一次、启动一次。
  #    编译错、一开机就闪退，20 分钟内就变红，不用等一小时。
  smoke:
    name: Simulator smoke test
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      built: ${{ steps.mark.outputs.built }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Kotlin Multiplatform)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-sim-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-sim-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: appleApp/DerivedData
          key: derived-sim-${{ runner.os }}-${{ hashFiles('appleApp/**/*.swift', 'appleApp/project.yml') }}
          restore-keys: |
            derived-sim-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: appleApp
        run: xcodegen generate

      # 必须先建具体设备。用 -sdk iphonesimulator 或 generic destination 编译时，
      # SwiftPM 的宏插件会被丢到 Debug-iphonesimulator 下，编译器找不到就报
      # "external macro implementation type could not be found"。
      - name: Create simulator
        run: |
          set -euo pipefail
          DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("^iPhone"))][0].name')
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | test("iOS")))] | sort_by(.version | split(".") | map(tonumber? // 0)) | last | .identifier')
          echo "simulator: $DEVTYPE / $RUNTIME"
          UDID=$(xcrun simctl create FlareCI "$DEVTYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        working-directory: appleApp
        run: |
          set -o pipefail
          xcodebuild \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build-sim.log

      - name: Mark build ok
        id: mark
        run: echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Install and launch, fail on crash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/appleApp/DerivedData/Build/Products/Debug-iphonesimulator/Flare.app"
          if [ ! -d "$APP" ]; then echo "::error::Flare.app was not produced"; exit 1; fi

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" dev.dimension.flare
          sleep 30
          xcrun simctl io "$UDID" screenshot screenshot-30s.png

          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'dev.dimension.flare'; then
            echo "OK: still running 30s after launch"
          else
            echo "::error::process gone within 30s (launch crash)"
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Flare"' > flare-sim.log 2>&1 || true
            mkdir -p crash
            cp "$HOME"/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
            exit 1
          fi

      - name: UI tests (non-blocking)
        continue-on-error: true
        working-directory: appleApp
        run: |
          xcodebuild test \
            -project Flare.xcodeproj \
            -scheme iOS \
            -destination "id=$UDID" \
            -derivedDataPath DerivedData \
            -only-testing:iOSInteractionTests \
            -only-testing:MediaViewerInteractionTests \
            -resultBundlePath "$RUNNER_TEMP/uitests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-build${{ github.run_number }}
          path: |
            screenshot-30s.png
            flare-sim.log
            crash/
            appleApp/build-sim.log
          if-no-files-found: ignore
          retention-days: 14

      # 失败自动开 Issue：把编译/闪退的关键日志贴进去，不用人肉复现
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOG=$(tail -n 80 appleApp/build-sim.log 2>/dev/null || echo "(no build log)")
          {
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- artifacts: smoke-build${{ github.run_number }}"
            echo ""
            echo '```'
            echo "$LOG"
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "CI 冒烟失败: build ${{ github.run_number }}" \
            --body-file /tmp/issue-body.md || true

  # 2) 正式 IPA。冒烟挂的是“启动闪退”时也照出包（方便真机验），
  #    但编译没过就直接跳过，省一小时。
  ipa:
    name: Release IPA
    needs: smoke
    if: always() && needs.smoke.outputs.built == 'true'
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Kotlin Multiplatform)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: appleApp/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('appleApp/**/*.swift', 'appleApp/project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: appleApp
        run: xcodegen generate

      - name: Build unsigned IPA (iOS 15, device)
        working-directory: appleApp
        run: |
          chmod +x ../gradlew
          xcodebuild \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            -archivePath /tmp/Flare.xcarchive \
            archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package IPA
        run: |
          rm -rf Payload Flare-iOS15.ipa
          mkdir -p Payload
          cp -r /tmp/Flare.xcarchive/Products/Applications/Flare.app Payload/
          zip -qry Flare-iOS15.ipa Payload
          ls -lh Flare-iOS15.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-ipa-build${{ github.run_number }}
          path: Flare-iOS15.ipa
          retention-days: 30

      - name: Publish to Releases (fixed link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios15-latest
          name: "Flare iOS15 - build ${{ github.run_number }}"
          prerelease: true
          files: Flare-iOS15.ipa
          body: |
            build ${{ github.run_number }} / ${{ github.sha }}
            冒烟结果：${{ needs.smoke.result }}
            固定下载地址（永远是最新一版）：
            https://github.com/${{ github.repository }}/releases/download/ios15-latest/Flare-iOS15.ipa

      - name: Summary
        run: |
          {
            echo "### Flare iOS15 build ${{ github.run_number }}"
            echo ""
            echo "- smoke: ${{ needs.smoke.result }}"
            echo "- 下载: https://github.com/${{ github.repository }}/releases/download/ios15-latest/Flare-iOS15.ipa"
          } >> "$GITHUB_STEP_SUMMARY"