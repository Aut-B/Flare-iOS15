name: Build Flare APK (Android)

on:
  workflow_dispatch:
  push:
    branches: [ ios15-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_JVM_ARGS: "-Xmx8G -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      # 固定签名：keystore 存在仓库 secret 里，这样以后每次重新编译都能覆盖安装，
      # 不会因为签名变化要求先卸载。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "缺少签名密钥 secret，将退回 debug 签名（下次升级需要先卸载）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > key.p12
          cat > signing.properties <<EOF
          storeFile=key.p12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          BUILD_NUMBER: '1782'
          BUILD_VERSION: '1.7.8'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Flare-android.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flare-android-apk
          path: out/Flare-android.apk
